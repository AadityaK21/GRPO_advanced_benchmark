[project]
name = "grpo-advanced-benchmark"
version = "0.1.0"
description = "Published GRPO advantage estimators, compared under matched conditions"
requires-python = ">=3.11"
# Pinned: TRL's internals change between releases, so the TRL check holds only for these versions.
dependencies = [
    "torch==2.14.1",
    "transformers==5.19.0",
    "trl==1.15.0",
    "datasets>=5.1",
    "numpy",
]

[project.optional-dependencies]
lora = ["peft"]
dev = ["pytest", "gymnasium"]
